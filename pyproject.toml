[project]
name = "chris"
version = "0.1.0"
description = "Chris — an AI agent raised in public"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "apscheduler>=3.10,<4",
  "openai>=1.50",
  "resend>=2.0",
  "stripe>=11",
  "httpx>=0.27",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "jinja2>=3.1",
  "markdown-it-py>=3",
  "python-frontmatter>=1.1",
  "pytz",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "freezegun>=1.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent*", "site*"]
