# Deploys Chris's body (agent/, scripts/, Dockerfile) to Fly.
# Manual trigger: a parent presses Deploy on the parent page (POST /parent/deploy → workflow_dispatch),
# or runs it from the Actions tab. It deploys whatever is on main, including Chris's own commits.
# Secret needed: FLY_API_TOKEN (a deploy-only token for app chris-brain).
name: deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Test gate (defense in depth): even a parent-triggered deploy won't ship red code.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider
      # Only reached when the suite above is green.
      - name: Guard vows and constitution (parent-controlled hash)
        run: |
          want="${{ secrets.SOUL_HASHES }}"
          got="$(sha256sum soul/vows.md soul/constitution.md | awk '{print $1}' | paste -sd, -)"
          if [ -z "$want" ]; then echo "SOUL_HASHES secret not set; refusing to deploy"; exit 1; fi
          if [ "$got" != "$want" ]; then echo "vows/constitution changed - only a parent can (update SOUL_HASHES)"; exit 1; fi
          echo "conscience intact"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false -a chris-brain --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
