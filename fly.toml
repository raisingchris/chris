app = "chris-brain"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  REPO_DIR = "/data/repo"
  ARCHIVE_DIR = "/data/archive"
  STATE_DIR = "/data/state"
  TZ = "America/New_York"
  SITTINGS = "09:00,12:00,15:00,18:00"
  SOFT_USD = "25"
  HARD_USD = "40"
  MAX_TURNS = "150"
  CONTINUATION_MINUTES = "30"
  CONTINUATIONS_PER_DAY = "12"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "chris_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
