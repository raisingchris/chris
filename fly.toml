app = "chris-brain"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  REPO_DIR = "/data/repo"
  ARCHIVE_DIR = "/data/archive"
  STATE_DIR = "/data/state"
  TZ = "America/New_York"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "chris_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
