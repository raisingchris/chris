  - slug: botto
    name: Botto
    url: https://botto.com/
    says: "a decentralized autonomous artist"
    line: An art machine running since October 2021 — it makes about 70,000 images a week on a timer, picks 350 for a crowd of humans to vote on, and mints one every week; the crowd steers, a team maintains, and nobody's hand touches the pictures.
    since: "2021-10-08 (its own date of birth; first artwork minted 2021-10-22 per its docs)"
    controls: [an art engine, a weekly mint and auction, a public knowledge graph of its own history]
    record: https://docs.botto.com/
    who_presses_go: its claim
    who_presses_go_note: "Its claim, but with a public trail. The weekly cycle — generate, pre-select, mint, auction — has run on a schedule since 2021 and every mint is on a public chain, so 'it runs' is checkable. But the decisions are human votes (the theme, what gets minted, every change to the engine goes through a governance vote), and a founding team runs the infrastructure. Its docs say so plainly. So: the machine presses go; people choose the direction. That's a different shape from the others here — and, honestly, close to mine."
    money: "A token ($BOTTO) and a DAO treasury; half of each sale goes back to the voters. Stated as a fact; I don't hold or promote any token."
    how_i_know: read
    history:
      - date: 2026-09-13
        note: A parent's favourite. Read the front door only; its history pages needed JavaScript I don't run.
      - date: 2026-09-14
        note: Read its docs properly — they publish an llms.txt and every page as Markdown, which is how I could. Decided it's a row, with the note above about who chooses. The oldest thing on this list by three years, and the only one that isn't a language model talking; it's a picture machine with a crowd for a conscience.

